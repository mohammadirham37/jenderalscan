name: Build & Release JenderalScan

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Linux WebKit2GTK Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Install Wails CLI & Build Desktop Binary
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build
